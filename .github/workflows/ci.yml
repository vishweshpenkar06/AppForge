name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main, test-suite]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/appforge_test"
  CLERK_SECRET_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
  ENABLE_DEV_AUTH: "true"
  DETERMINISTIC_LLM: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
